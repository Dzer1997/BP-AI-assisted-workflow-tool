services:
  backend:
    build:
      context: .
      dockerfile: src/realview_chat/api/backend/Dockerfile

    container_name: backend

    environment:
      - DATABASE_URL=sqlite:////app/data/realview_chat.db
      - PYTHONPATH=/app/src
      - CASES_ROOT=/app/cases  

    ports:
      - "5001:5001"

    volumes:
      - ./data:/app/data
      - C:\GitHub\BP-AI-assisted-workflow-tool\cases:/app/cases

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./src/realview_chat/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"